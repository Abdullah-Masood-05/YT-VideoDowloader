[project]
name = "youtube-video-downloader"
version = "2.0.2"
description = "Desktop YouTube video and audio downloader built on yt-dlp and PyQt6"
readme = "Readme.md"
authors = [
    { name = "Abdullah Masood", email = "Abdullah-Masood-05@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqt6>=6.5.0",
    "requests>=2.31.0",
    "yt-dlp>=2024.1.1",
]

[dependency-groups]
dev = [
    "nuitka>=4.2.2",
    "ordered-set>=4.1.0",
    "pillow>=10.0.0",
    "zstandard>=0.22.0",
]

[tool.uv]
package = false
