name: Build Linux packages

on:
  push:
    branches: [main, ci/linux]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  APP: youtube-video-downloader
  FFMPEG_REPO: Abdullah-Masood-05/ffmpeg-ytdl-minimal-build
  FFMPEG_RELEASE: v1.1.0
  NFPM_VERSION: 2.43.0

jobs:
  build:
    name: Build (Nuitka + nfpm)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf ccache gcc xvfb xauth \
            libegl1 libgl1 libfontconfig1 libfreetype6 libdbus-1-3 \
            libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --locked --python "$(command -v python)"

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            nuitka-linux-${{ hashFiles('uv.lock') }}-
            nuitka-linux-

      - name: Build standalone app
        run: packaging/linux/build.sh

      - name: Bundle FFmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg" && cd "$RUNNER_TEMP/ffmpeg"
          gh release download "$FFMPEG_RELEASE" -R "$FFMPEG_REPO" \
            -p ffmpeg-linux-x86_64 -p ffprobe-linux-x86_64 -p SHA256SUMS.txt
          grep -E ' \*?(ffmpeg|ffprobe)-linux-x86_64$' SHA256SUMS.txt > sums.txt
          test "$(wc -l < sums.txt)" -eq 2
          sha256sum -c sums.txt
          dist="$GITHUB_WORKSPACE/build/linux/dist"
          install -m 0755 ffmpeg-linux-x86_64 "$dist/ffmpeg"
          install -m 0755 ffprobe-linux-x86_64 "$dist/ffprobe"
          "$dist/ffmpeg" -hide_banner -version | sed -n 1p
          "$dist/ffprobe" -hide_banner -version | sed -n 1p

      - name: Smoke test (xvfb)
        run: packaging/linux/smoke_test.sh build/linux/dist/$APP 10

      - name: Install nfpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
          nfpm --version

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          nfpm pkg -f packaging/linux/nfpm.yaml -p deb       -t "dist/${APP}_${VERSION}_amd64.deb"
          nfpm pkg -f packaging/linux/nfpm.yaml -p rpm       -t "dist/${APP}-${VERSION}-1.x86_64.rpm"
          nfpm pkg -f packaging/linux/nfpm.yaml -p archlinux -t "dist/${APP}-${VERSION}-1-x86_64.pkg.tar.zst"
          ls -l dist
          dpkg-deb --info "dist/${APP}_${VERSION}_amd64.deb"
          {
            echo "### Linux packages"
            echo
            echo '| File | Size |'
            echo '| --- | --- |'
            for f in dist/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  validate:
    name: Validate (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            family: deb
          - image: debian:12
            family: deb
          - image: fedora:latest
            family: rpm
          - image: archlinux:latest
            family: arch
    container: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist

      - name: Install package
        run: |
          case "${{ matrix.family }}" in
            deb)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y "./dist/${APP}_${VERSION}_amd64.deb" ;;
            rpm)
              dnf install -y "./dist/${APP}-${VERSION}-1.x86_64.rpm" /usr/bin/ldd ;;
            arch)
              pacman -Syu --noconfirm
              pacman -U --noconfirm "./dist/${APP}-${VERSION}-1-x86_64.pkg.tar.zst" ;;
          esac

      - name: Check installed files
        run: |
          test -x "/opt/$APP/$APP"
          test "$(readlink -f /usr/bin/$APP)" = "/opt/$APP/$APP"
          test -f "/usr/share/applications/$APP.desktop"
          test -f "/usr/share/icons/hicolor/256x256/apps/$APP.png"
          test -f "/usr/share/licenses/$APP/LICENSE"

      - name: ldd (no missing libraries)
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            head -c4 "$f" | grep -q 'ELF' || continue
            out=$(ldd "$f" 2>&1 || true)
            if grep -q 'not found' <<<"$out"; then
              echo "::error::$f"
              grep 'not found' <<<"$out"
              missing=1
            fi
          done < <(find "/opt/$APP" -type f -print0)
          test "$missing" -eq 0
          echo "All ELF files resolve their libraries."

      - name: Bundled FFmpeg runs
        run: |
          test -x "/opt/$APP/ffmpeg"
          test -x "/opt/$APP/ffprobe"
          "/opt/$APP/ffmpeg" -hide_banner -version | sed -n 1p
          "/opt/$APP/ffprobe" -hide_banner -version | sed -n 1p

      - name: Install xvfb
        run: |
          case "${{ matrix.family }}" in
            deb)  apt-get install -y xvfb xauth ;;
            rpm)  dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth which ;;
            arch) pacman -S --noconfirm xorg-server-xvfb xorg-xauth ;;
          esac

      - name: Smoke test (xvfb)
        run: packaging/linux/smoke_test.sh "/usr/bin/$APP" 10

      - name: Uninstall
        run: |
          case "${{ matrix.family }}" in
            deb)  apt-get remove -y "$APP" ;;
            rpm)  dnf remove -y "$APP" ;;
            arch) pacman -R --noconfirm "$APP" ;;
          esac
          test ! -e "/usr/bin/$APP"
          test ! -e "/opt/$APP/$APP"

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
