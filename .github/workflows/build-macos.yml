name: Build macOS (experimental)

# Unsigned Apple Silicon (arm64) .app inside a .dmg. Experimental: not signed
# with a Developer ID and not notarized (ad-hoc signature only).

on:
  push:
    branches: [main, ci/macos]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: macOS arm64 app + dmg
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      FFMPEG_REPO: Abdullah-Masood-05/ffmpeg-ytdl-minimal-build
      FFMPEG_RELEASE: v1.1.0
      FFMPEG_OPTIONAL: "true"  # TEMPORARY until the release exists
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          VERSION="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=YouTubeVideoDownloader-$VERSION-macos-arm64.dmg" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ── FFmpeg (prebuilt, from ffmpeg-ytdl-minimal-build) ───────────────
      - name: Download FFmpeg
        id: ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ffmpeg
          if [ "${FFMPEG_OPTIONAL:-}" = "true" ] && ! gh release view "$FFMPEG_RELEASE" -R "$FFMPEG_REPO" >/dev/null 2>&1; then
            echo "::warning::$FFMPEG_REPO $FFMPEG_RELEASE not found; building without FFmpeg (TEMPORARY)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh release download "$FFMPEG_RELEASE" -R "$FFMPEG_REPO" -D ffmpeg \
            -p ffmpeg-macos-arm64 -p ffprobe-macos-arm64 -p SHA256SUMS.txt
          cd ffmpeg
          grep -E ' \*?(ffmpeg|ffprobe)-macos-arm64$' SHA256SUMS.txt > sums.txt
          test "$(wc -l < sums.txt)" -eq 2
          shasum -a 256 -c sums.txt
          mv ffmpeg-macos-arm64 ffmpeg
          mv ffprobe-macos-arm64 ffprobe
          chmod +x ffmpeg ffprobe
          rm -f sums.txt SHA256SUMS.txt

      - name: Check FFmpeg
        if: steps.ffmpeg.outputs.skip != 'true'
        run: |
          for bin in ffmpeg/ffmpeg ffmpeg/ffprobe; do
            file "$bin"
            otool -L "$bin"
            if otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/)'; then
              echo "::error::$bin links non-system libraries"; exit 1
            fi
          done
          ffmpeg/ffmpeg -hide_banner -version | sed -n 1p

      # ── Python + Nuitka ─────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: |
          uv sync --locked --python "$(which python)"
          .venv/bin/python -m nuitka --version

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-arm64-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-macos-arm64-

      - name: Build app bundle
        run: packaging/macos/build_app.sh "${{ steps.version.outputs.version }}" ffmpeg

      # ── Smoke tests ─────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          APP="build_macos/YouTube Video Downloader.app"
          MACOS="$APP/Contents/MacOS"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          ls -la "$MACOS" > "$RUNNER_TEMP/macos-dir.txt"; sed -n 1,60p "$RUNNER_TEMP/macos-dir.txt"
          file "$MACOS/$EXE"
          test -f "$MACOS/resources/icons/app.png"

          echo ">> bundled ffmpeg"
          if [ "${{ steps.ffmpeg.outputs.skip }}" != "true" ]; then
            "$MACOS/ffmpeg" -hide_banner -version | sed -n 1p
            "$MACOS/ffprobe" -hide_banner -version | sed -n 1p
          fi

          echo ">> launching app for 10s"
          export YTDL_CONFIG_DIR="$RUNNER_TEMP/ytdl-config"
          "$MACOS/$EXE" > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "App is alive after 10s (pid $PID)"
            kill "$PID"; wait "$PID" 2>/dev/null || true
          else
            RC=0; wait "$PID" || RC=$?
            echo "::error::App exited early with code $RC"
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/app.log"

      # ── DMG ─────────────────────────────────────────────────────────────
      - name: Create DMG
        run: |
          packaging/macos/make_dmg.sh "build_macos/YouTube Video Downloader.app" "dist/${{ steps.version.outputs.dmg }}"
          shasum -a 256 "dist/${{ steps.version.outputs.dmg }}" | tee "dist/${{ steps.version.outputs.dmg }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach DMG to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
