name: Build macOS (experimental)

# Unsigned Apple Silicon (arm64) .app inside a .dmg. Experimental: not signed
# with a Developer ID and not notarized (ad-hoc signature only).

on:
  push:
    branches: [main, ci/macos]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: macOS arm64 app + dmg
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          VERSION="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=YouTubeVideoDownloader-$VERSION-macos-arm64.dmg" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ── FFmpeg (minimal LGPL, static lame/opus) ──────────────────────────
      - name: Cache FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-n7.1.1-macos-arm64-${{ hashFiles('packaging/macos/build_ffmpeg_macos.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install lame opus pkgconf
          packaging/macos/build_ffmpeg_macos.sh ffmpeg

      - name: Check FFmpeg
        run: |
          for bin in ffmpeg/ffmpeg ffmpeg/ffprobe; do
            file "$bin"
            otool -L "$bin"
            if otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/)'; then
              echo "::error::$bin links non-system libraries"; exit 1
            fi
          done
          ffmpeg/ffmpeg -hide_banner -version | sed -n 1p

      # ── Python + Nuitka ─────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: |
          uv sync --locked --python "$(which python)"
          .venv/bin/python -m nuitka --version

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-macos-arm64-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-macos-arm64-

      - name: Build app bundle
        run: packaging/macos/build_app.sh "${{ steps.version.outputs.version }}" ffmpeg

      # ── Smoke tests ─────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          APP="build_macos/YouTube Video Downloader.app"
          MACOS="$APP/Contents/MacOS"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          ls -la "$MACOS" > "$RUNNER_TEMP/macos-dir.txt"; sed -n 1,60p "$RUNNER_TEMP/macos-dir.txt"
          file "$MACOS/$EXE"
          test -f "$MACOS/resources/icons/app.png"

          echo ">> bundled ffmpeg"
          "$MACOS/ffmpeg" -hide_banner -version | sed -n 1p
          "$MACOS/ffprobe" -hide_banner -version | sed -n 1p

          echo ">> launching app for 10s"
          export YTDL_CONFIG_DIR="$RUNNER_TEMP/ytdl-config"
          "$MACOS/$EXE" > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "App is alive after 10s (pid $PID)"
            kill "$PID"; wait "$PID" 2>/dev/null || true
          else
            RC=0; wait "$PID" || RC=$?
            echo "::error::App exited early with code $RC"
            cat "$RUNNER_TEMP/app.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/app.log"

      # ── DMG ─────────────────────────────────────────────────────────────
      - name: Create DMG
        run: |
          packaging/macos/make_dmg.sh "build_macos/YouTube Video Downloader.app" "dist/${{ steps.version.outputs.dmg }}"
          shasum -a 256 "dist/${{ steps.version.outputs.dmg }}" | tee "dist/${{ steps.version.outputs.dmg }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach DMG to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
