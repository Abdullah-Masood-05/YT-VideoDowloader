name: Build Windows

on:
  push:
    branches: [main, ci/windows]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Prebuilt minimal LGPL FFmpeg from
  # https://github.com/Abdullah-Masood-05/ffmpeg-ytdl-minimal-build
  FFMPEG_REPO: Abdullah-Masood-05/ffmpeg-ytdl-minimal-build
  FFMPEG_RELEASE: v1.0.0
  FFMPEG_ASSET: ffmpeg.exe
  FFPROBE_ASSET: ffprobe.exe

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows exe + installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked

      - name: Read and check version
        id: version
        shell: pwsh
        run: |
          $version = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if (-not $version) { throw 'could not read version from pyproject.toml' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
          # installer.iss hard-codes the version (its #define cannot be
          # overridden from the ISCC command line), so make sure it agrees.
          if (-not (Select-String -Path installer.iss -SimpleMatch "#define MyAppVersion `"$version`"" -Quiet)) {
            throw "installer.iss MyAppVersion does not match pyproject version $version"
          }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "tag ${{ github.ref_name }} does not match pyproject version $version"
          }

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Compile with Nuitka (same flags as build.bat)
        shell: cmd
        run: >-
          .venv\Scripts\python.exe -m nuitka
          --onefile
          --windows-console-mode=disable
          --lto=no
          --jobs=%NUMBER_OF_PROCESSORS%
          --enable-plugin=pyqt6
          --noinclude-custom-mode=yt_dlp.extractor:bytecode
          --nofollow-import-to=unittest,test,pytest,_pytest,doctest,pdb
          --nofollow-import-to=setuptools,pip,distutils,pkg_resources
          --noinclude-setuptools-mode=nofollow
          --python-flag=no_docstrings
          --include-qt-plugins=sensible,styles,platforms
          --include-data-files=resources\icons\app.ico=resources\icons\app.ico
          --include-data-files=resources\icons\app.png=resources\icons\app.png
          --windows-icon-from-ico=resources\icons\app.ico
          --company-name="YTDownloader"
          --product-name="YouTube Video Downloader"
          --file-description="YouTube Video Downloader"
          --file-version=${{ steps.version.outputs.version }}.0
          --product-version=${{ steps.version.outputs.version }}.0
          --copyright="Copyright (c) 2026 Abdullah Masood"
          --assume-yes-for-downloads
          --output-filename=YouTubeVideoDownloader.exe
          --output-dir=build_dist
          --remove-output
          main.py

      - name: Smoke test (launch, stay alive 10 s)
        shell: pwsh
        run: |
          $exe = Resolve-Path build_dist\YouTubeVideoDownloader.exe
          Write-Host ("Size: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $alive = Get-Process -Name YouTubeVideoDownloader -ErrorAction SilentlyContinue
          if (-not $alive) {
            $p.Refresh()
            throw "App exited early (exit code: $($p.ExitCode))"
          }
          Write-Host "Running processes:"; $alive | Format-Table Id, ProcessName, WorkingSet64 -AutoSize
          $alive | Stop-Process -Force
          Write-Host 'Smoke test passed.'

      - name: Download FFmpeg (${{ env.FFMPEG_RELEASE }}) and verify SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dl = Join-Path $env:RUNNER_TEMP ffmpeg-dl
          gh release download $env:FFMPEG_RELEASE -R $env:FFMPEG_REPO -D $dl `
            -p $env:FFMPEG_ASSET -p $env:FFPROBE_ASSET -p SHA256SUMS.txt
          if ($LASTEXITCODE) { exit 1 }
          $sums = @{}
          foreach ($line in Get-Content (Join-Path $dl SHA256SUMS.txt)) {
            if ($line -match '^([0-9a-fA-F]{64})\s+\*?(.+?)\s*$') { $sums[$Matches[2]] = $Matches[1].ToLower() }
          }
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          foreach ($pair in @(@($env:FFMPEG_ASSET, 'ffmpeg.exe'), @($env:FFPROBE_ASSET, 'ffprobe.exe'))) {
            $asset, $target = $pair
            $expected = $sums[$asset]
            if (-not $expected) { throw "$asset not listed in SHA256SUMS.txt" }
            $actual = (Get-FileHash (Join-Path $dl $asset) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "SHA-256 mismatch for ${asset}: got $actual, expected $expected" }
            Write-Host "OK  $actual  $asset -> ffmpeg\$target"
            Copy-Item (Join-Path $dl $asset) (Join-Path ffmpeg $target)
          }
          ffmpegfmpeg.exe -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE) { exit 1 }
          ffmpegfprobe.exe -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE) { exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit 1 }
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          & $iscc installer.iss
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem build_dist\*.exe, installer_output\*.exe |
            Format-Table Name, @{n='MB';e={'{0:N1}' -f ($_.Length / 1MB)}} -AutoSize
          Get-FileHash build_dist\*.exe, installer_output\*.exe -Algorithm SHA256 | Format-Table Hash, Path -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeVideoDownloader-installer
          path: installer_output/YouTubeVideoDownloader-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeVideoDownloader-exe
          path: build_dist/YouTubeVideoDownloader.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/YouTubeVideoDownloader-Setup-*.exe
            build_dist/YouTubeVideoDownloader.exe
