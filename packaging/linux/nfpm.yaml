# nfpm config for the .deb, .rpm and Arch .pkg.tar.zst packages.
#
# Run from the repository root after packaging/linux/build.sh, e.g.:
#   VERSION=2.0.1 nfpm pkg -f packaging/linux/nfpm.yaml -p deb -t dist/
#
# All three formats ship the same files. Only the dependency names differ.
name: youtube-video-downloader
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: video
priority: optional
maintainer: Abdullah Masood <Abdullah-Masood-05@users.noreply.github.com>
vendor: Abdullah Masood
homepage: https://github.com/Abdullah-Masood-05/YT-VideoDowloader
license: GPL-3.0-only
description: |-
  Desktop YouTube video and audio downloader.
  A PyQt6 front end for yt-dlp: paste a link, pick a quality or an audio
  format, and download videos, audio and whole playlists. Ships its own
  static ffmpeg/ffprobe build for merging streams and converting audio.

contents:
  # Nuitka standalone folder, including the bundled static ffmpeg/ffprobe.
  - src: build/linux/dist
    dst: /opt/youtube-video-downloader
    type: tree
  - src: /opt/youtube-video-downloader/youtube-video-downloader
    dst: /usr/bin/youtube-video-downloader
    type: symlink

  - src: packaging/linux/youtube-video-downloader.desktop
    dst: /usr/share/applications/youtube-video-downloader.desktop
    file_info: {mode: 0644}

  - src: build/linux/icons/48x48/apps/youtube-video-downloader.png
    dst: /usr/share/icons/hicolor/48x48/apps/youtube-video-downloader.png
    file_info: {mode: 0644}
  - src: build/linux/icons/64x64/apps/youtube-video-downloader.png
    dst: /usr/share/icons/hicolor/64x64/apps/youtube-video-downloader.png
    file_info: {mode: 0644}
  - src: build/linux/icons/128x128/apps/youtube-video-downloader.png
    dst: /usr/share/icons/hicolor/128x128/apps/youtube-video-downloader.png
    file_info: {mode: 0644}
  - src: build/linux/icons/256x256/apps/youtube-video-downloader.png
    dst: /usr/share/icons/hicolor/256x256/apps/youtube-video-downloader.png
    file_info: {mode: 0644}
  - src: build/linux/icons/512x512/apps/youtube-video-downloader.png
    dst: /usr/share/icons/hicolor/512x512/apps/youtube-video-downloader.png
    file_info: {mode: 0644}

  - src: LICENSE
    dst: /usr/share/licenses/youtube-video-downloader/LICENSE
    file_info: {mode: 0644}
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/licenses/youtube-video-downloader/THIRD_PARTY_NOTICES.md
    file_info: {mode: 0644}
  # Debian policy wants the licence under /usr/share/doc/<package>/copyright.
  - src: LICENSE
    dst: /usr/share/doc/youtube-video-downloader/copyright
    file_info: {mode: 0644}
    packager: deb

# Nuitka bundles Qt and most of its libraries; the ones below are the GLib /
# X11 / OpenGL / D-Bus system libraries Qt expects from the host.
overrides:
  deb:
    depends:
      # Ubuntu 24.04+ renamed it for the 64-bit time_t transition.
      - libglib2.0-0t64 | libglib2.0-0
      - libegl1
      - libgl1
      - libfontconfig1
      - libfreetype6
      - libdbus-1-3
      - libx11-6
      - libx11-xcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
    recommends:
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
  rpm:
    # Soname dependencies resolve on both Fedora and openSUSE, whose package
    # names differ.
    depends:
      - libglib-2.0.so.0()(64bit)
      - libgthread-2.0.so.0()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libdbus-1.so.3()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libxcb.so.1()(64bit)
      - libxcb-cursor.so.0()(64bit)
      - libxcb-icccm.so.4()(64bit)
      - libxcb-image.so.0()(64bit)
      - libxcb-keysyms.so.1()(64bit)
      - libxcb-randr.so.0()(64bit)
      - libxcb-render.so.0()(64bit)
      - libxcb-render-util.so.0()(64bit)
      - libxcb-shape.so.0()(64bit)
      - libxcb-shm.so.0()(64bit)
      - libxcb-sync.so.1()(64bit)
      - libxcb-xfixes.so.0()(64bit)
      - libxcb-xinerama.so.0()(64bit)
      - libxcb-xkb.so.1()(64bit)
    recommends:
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
  archlinux:
    depends:
      - glib2
      - libglvnd
      - fontconfig
      - freetype2
      - dbus
      - libx11
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - xcb-util-cursor
      - xcb-util-image
      - xcb-util-keysyms
      - xcb-util-renderutil
      - xcb-util-wm
    suggests:
      - wayland

rpm:
  summary: Desktop YouTube video and audio downloader
  group: Applications/Multimedia
  packager: Abdullah Masood <Abdullah-Masood-05@users.noreply.github.com>

archlinux:
  packager: Abdullah Masood <Abdullah-Masood-05@users.noreply.github.com>
